<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastoral da Partilha</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'primary': '#13204A',
            'on-primary': '#FFFFFF',
            'secondary': '#1C9CD6',
            'accent-orange': '#EF6D2E',
            'accent-green': '#5CB246',
            'accent-blue': '#1C9CD6',
            'surface': '#FFFFFF',
            'on-surface': '#1A202C',
            'surface-ground': '#F5F7FA',
            'surface-variant': '#E8EDF5',
            'on-surface-variant': '#4A5568',
            'outline': '#CBD5E1',
            'outline-light': '#E2E8F0',
            'error': '#DC2626',
            'error-container': '#FEE2E2',
            'on-error-container': '#991B1B',
            'warning': '#D97706',
            'warning-container': '#FEF3C7',
            'on-warning-container': '#92400E',
            'success': '#16A34A',
            'success-container': '#DCFCE7',
            'on-success-container': '#166534',
          },
          fontFamily: {
            'display': ['Poppins', 'sans-serif'],
            'sans': ['Inter', 'sans-serif'],
          },
          borderRadius: { 'lg': '16px', 'md': '12px' },
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    h1,h2,h3,.font-display { font-family: 'Poppins', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; vertical-align: middle; }
    .nav-link.active { background: rgba(255,255,255,.12); color: #fff; }
    .nav-link.active .material-symbols-outlined { color: #fff !important; }
    [x-cloak]{display:none}
  </style>
</head>
<body class="bg-surface-ground text-on-surface min-h-screen">

  <header class="lg:hidden sticky top-0 z-30 flex items-center gap-3 bg-primary text-white px-4 h-16 shadow-md">
    <button id="btn-menu" class="p-1"><span class="material-symbols-outlined text-3xl">menu</span></button>
    <span class="font-display font-bold text-lg">Pastoral da Partilha</span>
  </header>

  <div class="flex">

    <aside id="sidebar"
      class="fixed lg:static inset-y-0 left-0 z-40 w-[260px] bg-primary text-white/80 flex flex-col p-4
             -translate-x-full lg:translate-x-0 transition-transform duration-200 min-h-screen">
      <div class="flex items-center gap-3 px-2 py-4 mb-4 border-b border-white/10">
        <div class="flex gap-0.5 text-2xl leading-none">
          <span class="material-symbols-outlined text-accent-orange">emoji_people</span>
          <span class="material-symbols-outlined text-accent-green -ml-2">emoji_people</span>
          <span class="material-symbols-outlined text-accent-blue -ml-2">emoji_people</span>
        </div>
        <div class="font-display font-bold text-white leading-tight">
          <div class="text-[11px] tracking-widest text-white/60">PASTORAL DA</div>
          <div class="text-lg -mt-0.5">Partilha</div>
        </div>
      </div>
      <nav class="flex-1 flex flex-col gap-1" id="nav"></nav>
      <div class="px-2 py-3 text-xs text-white/40 border-t border-white/10">Sistema da pastoral</div>
    </aside>

    <div id="backdrop" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden"></div>

    <main class="flex-1 min-w-0 p-5 sm:p-8 max-w-[1200px]" id="app">
      <div class="text-on-surface-variant">Carregando…</div>
    </main>
  </div>

  <div id="modal-root"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
